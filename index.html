<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savdo</title>
<meta name="theme-color" content="#1a3c34" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a3c34" media="(prefers-color-scheme: dark)">
<meta name="description" content="Барномаи касса: телефон ва компютер — як база.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Savdo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700&display=swap"></noscript>
<style>
:root{
  --ink:#1c2b28;--muted:#6a7c76;--bg:#f3f1ea;--paper:#fffcf7;--line:#e4ddd0;
  --forest:#1a3c34;--forest-2:#244a41;--gold:#e2b13c;--gold-soft:#fff3d1;
  --mint:#e7f5ef;--ok:#1f8a66;--warn:#b07a12;--danger:#c2473f;
  --radius:20px;--font:'Manrope',system-ui,-apple-system,sans-serif;--display:'Sora',system-ui,-apple-system,sans-serif;
  --shadow:0 14px 40px rgba(26,60,52,.08);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;font:16px/1.45 var(--font);color:var(--ink);background:
  radial-gradient(800px 360px at 100% 0%,rgba(226,177,60,.18),transparent 55%),
  radial-gradient(700px 400px at 0% 100%,rgba(26,60,52,.08),transparent 50%),
  linear-gradient(180deg,#f7f5ef,var(--bg));
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
.install-banner{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px}
.install-banner b{display:block;font-size:15px;margin-bottom:2px;font-family:var(--display)}
.install-banner .store-row{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.install-banner .store-ico{width:52px;height:52px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;color:#2a2208;background:linear-gradient(145deg,#f0c35a,#d9a62e);box-shadow:0 8px 18px rgba(226,177,60,.28)}
.install-banner .store-meta{color:var(--muted);font-size:12px;line-height:1.35}
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(165deg,#14352e 0%,#1a3c34 45%,#244a41 100%);color:#fff;transition:opacity .35s ease,visibility .35s ease}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;animation:up .5s ease}
.splash .logo{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;font-family:var(--display);font-size:32px;font-weight:700;color:#2a2208;background:linear-gradient(145deg,#f0c35a,#d9a62e);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.splash h1{margin:0;font-family:var(--display);font-size:30px;letter-spacing:-.03em;color:#fff}
.splash p{margin:10px 0 0;color:rgba(255,255,255,.72);font-size:14px}
@media(display-mode:standalone){
  body{background:#eef1f4}
  .app{min-height:100dvh}
  aside{box-shadow:8px 0 32px rgba(10,30,26,.18)}
  .install-banner{display:none!important}
}
button,input,select{font:inherit}
button{border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--paper);color:var(--ink);transition:transform .12s ease,filter .12s ease}
button:hover{filter:brightness(.98)}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7eb8ff;outline-offset:2px}
.primary{background:linear-gradient(135deg,#2a6b58,var(--forest));color:#fff;box-shadow:0 10px 24px rgba(26,60,52,.22)}
.gold{background:linear-gradient(135deg,#f0c35a,var(--gold));color:#3a2a08;box-shadow:0 10px 24px rgba(226,177,60,.28)}
.outline{background:rgba(255,252,247,.9);border:1px solid var(--line)}
.danger{background:#fdeceb;color:var(--danger)}
.soft{background:var(--mint);color:var(--ok)}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--forest),var(--forest-2));color:#c5d8d1;padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;color:#fff;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.03em;padding:4px 6px 8px}
.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#f0c35a,#d9a62e);color:#2a2208;font-size:18px;box-shadow:0 8px 18px rgba(226,177,60,.35)}
.nav-label{font-size:11px;letter-spacing:.12em;color:#8eaaa1;margin:22px 8px 10px}
nav{display:grid;gap:6px}
nav button{background:transparent;color:#c5d8d1;text-align:left;display:flex;gap:10px;align-items:center;padding:13px 14px;border-radius:14px;font-size:15px}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button.active{background:rgba(240,195,90,.16);color:#f0c35a}
.aside-foot{margin-top:auto;padding:16px 8px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.aside-foot b{display:block;color:#fff;font-size:14px;margin-bottom:2px}

main{min-width:0;padding:22px 26px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--display);font-size:28px;letter-spacing:-.03em}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12px;font-weight:700;padding:8px 12px;border-radius:999px;background:var(--gold-soft);color:var(--warn)}
.chip.ok{background:var(--mint);color:var(--ok)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);animation:up .35s ease both}
.stat:nth-child(2){animation-delay:.04s}.stat:nth-child(3){animation-delay:.08s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat strong{display:block;margin-top:8px;font-family:var(--display);font-size:24px;letter-spacing:-.03em}
.stat.dark{background:linear-gradient(145deg,var(--forest),#2d564b);color:#fff;border:0}
.stat.dark span{color:#b7cfc6}.stat.dark strong{color:#f0c35a}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:16px}.panel-h p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.panel-b{padding:16px 18px}

.quick{display:grid;grid-template-columns:1.35fr .95fr;gap:14px;margin-bottom:14px}
.sell-box{padding:18px}
.sell-box h2{margin:0 0 4px;font-family:var(--display);font-size:20px}
.sell-box .hint{color:var(--muted);font-size:13px;margin-bottom:14px}
.cart-box{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px}
.cart-total{background:linear-gradient(145deg,var(--forest),#2d564b);color:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.cart-total .lbl{font-size:13px;color:#b7cfc6;font-weight:600}
.cart-total .sum{font-family:var(--display);font-size:34px;letter-spacing:-.03em;margin:8px 0 4px;color:#f0c35a}
.cart-total .meta{font-size:13px;color:#c5d8d1}
.cart-pay{width:100%;padding:18px;font-size:18px;border-radius:16px}
.cart-lines{display:grid;gap:8px;max-height:320px;overflow:auto}
.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;background:#f7f4ec;border-radius:14px}
.cart-line b{font-size:13px;display:block}
.cart-line .meta{font-size:12px;color:var(--muted);margin-top:4px}
.cart-price-wrap{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}
.cart-price-input{width:88px;min-height:36px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;font:700 14px Manrope,system-ui,sans-serif;color:var(--ink);background:#fff}
.qtybox{display:flex;align-items:center;gap:6px}
.qtybox button{width:34px;height:34px;padding:0;border-radius:10px;font-size:18px;background:#fff;border:1px solid var(--line)}
.qtybox span{min-width:24px;text-align:center;font-weight:800}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;max-height:520px;overflow:auto;padding-right:2px}
.pbtn{text-align:left;padding:10px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;gap:6px;min-height:200px;align-content:start}
.bars{display:flex;align-items:flex-end;gap:6px;min-height:110px;padding:8px 4px 0;overflow-x:auto}
.bar-col{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-col .bar{width:100%;max-width:36px;background:linear-gradient(180deg,var(--gold),#c9972a);border-radius:6px 6px 2px 2px}
.bar-col span{font-size:10px;color:var(--muted);font-weight:600}
.outline.active{background:var(--gold-soft);border-color:#e2b13c;color:var(--ink)}
.dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:900px){.dash-grid{grid-template-columns:repeat(4,1fr)}}
.dash-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;box-shadow:var(--shadow);display:grid;gap:6px}
.dash-card.dark{background:linear-gradient(145deg,var(--forest),var(--forest-2));color:#fff;border:none}
.dash-card span{font-size:12px;font-weight:700;color:var(--muted)}
.dash-card.dark span{color:rgba(255,255,255,.72)}
.dash-card strong{font-family:var(--display);font-size:26px;line-height:1.1}
.dash-card .sub{font-size:12px;color:var(--muted)}
.dash-card.dark .sub{color:rgba(255,255,255,.65)}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--ok)}.delta.down{color:var(--danger)}.delta.flat{color:var(--muted)}
.dash-card.dark .delta.up{color:#9dffc6}.dash-card.dark .delta.down{color:#ffb4ae}.dash-card.dark .delta.flat{color:rgba(255,255,255,.7)}
.pbtn:hover{border-color:#c9b48a;background:var(--gold-soft)}
.pbtn .ph{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:linear-gradient(145deg,#f0ebe1,#e5dfd2);display:grid;place-items:center;font-size:28px;color:#8a8070;overflow:hidden}
.pbtn .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pbtn b{font-size:13px;line-height:1.25}
.pbtn small{color:var(--muted);font-size:11px;font-weight:600}
.pbtn .price{color:var(--ok);font-weight:800;font-size:14px}
.pbtn.out{opacity:.45;filter:grayscale(.3)}
.pbtn .more{margin-top:2px;padding:6px 8px;font-size:11px;border-radius:10px;background:#f3efe6;color:var(--muted);width:100%}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{padding:8px 12px;border-radius:999px;font-size:12px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.cats button.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;background:#efe9dd;display:inline-grid;place-items:center;font-size:18px;flex:0 0 auto;overflow:hidden;vertical-align:middle}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-pick{display:grid;gap:8px}
.img-pick .preview{width:96px;height:96px;border-radius:14px;object-fit:cover;background:#efe9dd;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.img-pick .preview img{width:100%;height:100%;object-fit:cover}
.img-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.side-actions{display:grid;gap:10px;align-content:start}
.big{padding:18px 16px;font-size:16px;border-radius:16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.big small{font-weight:600;opacity:.75;font-size:12px}
.today-list{display:grid;gap:8px;max-height:280px;overflow:auto}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:#f7f4ec;font-size:13px}
.row b{font-size:13px}
.row .meta{color:var(--muted);font-size:12px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 18px 0}
.tabs button{padding:9px 14px;border-radius:999px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:13px}
.tabs button.active{background:var(--forest);color:#fff}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;align-items:center}
.toolbar input{flex:1;min-width:160px}
input,select{border:1px solid #ddd4c5;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:#c9b48a;box-shadow:0 0 0 3px rgba(226,177,60,.18);outline:none}

.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f7f4ec;padding:11px 16px;border-block:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid #efe9dd;font-size:13.5px}
tr:hover td{background:#fffcf5}
.pill{display:inline-block;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;background:var(--mint);color:var(--ok)}
.pill.warn{background:var(--gold-soft);color:var(--warn)}
.pill.gray{background:#eceae4;color:#6d736f}
.pill.debt{background:#fdeceb;color:var(--danger)}
.pill.return{background:#e8eefc;color:#3558a0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:7px 10px;font-size:12px;border-radius:10px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;font-family:var(--display);color:var(--ink);font-size:18px}
.empty p{margin:0 0 14px;font-size:14px}
.lang-switch{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.lang-switch.compact{margin:0}
.lang-switch button{padding:7px 10px;font-size:12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700}
.lang-switch button.active{background:var(--forest);color:#fff;border-color:var(--forest)}
.chips .lang-switch button{padding:6px 9px;font-size:11px}
.auth-box .lang-switch{justify-content:center;margin-bottom:16px}
.shift-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.shift-bar.on{background:linear-gradient(135deg,#e7f5ef,#fff);border-color:#c5e0d4}
.shift-bar b{display:block;font-size:14px;margin-bottom:2px}
.shift-bar span{color:var(--muted);font-size:12px}
.shift-bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.invent-list{display:grid;gap:8px;max-height:50vh;overflow:auto}
.invent-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:10px 12px;background:#f7f4ec;border-radius:12px}
.invent-row .meta{font-size:12px;color:var(--muted)}
.invent-row label{margin:0}
.invent-row input{width:100%}

.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.formgrid .wide{grid-column:1/-1}
label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:12px}
.paymodes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.paymodes label{display:flex!important;align-items:center;gap:6px;margin:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink)!important;cursor:pointer}
.hint{background:var(--mint);color:#2f6b56;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}
.error{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0}

dialog{border:0;border-radius:22px;width:min(520px,94vw);padding:24px;box-shadow:0 30px 90px rgba(20,40,35,.28);background:var(--paper)}
dialog::backdrop{background:rgba(18,36,32,.55);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 14px;font-family:var(--display);font-size:22px}
.dialogbuttons{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}

.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.15fr .85fr}
.auth-art{padding:min(9vw,80px);color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;background:
  radial-gradient(520px 340px at 85% 15%,rgba(240,195,90,.34),transparent 52%),
  radial-gradient(480px 300px at 10% 90%,rgba(80,160,140,.22),transparent 50%),
  linear-gradient(155deg,#0e2420,#1a3c34 48%,#2f5d50)}
.auth-art::after{content:"";position:absolute;inset:0;opacity:.22;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px}
.auth-art>*{position:relative;z-index:1}
.auth-art .brand{font-size:clamp(34px,5vw,46px)}
.auth-art h1{font-family:var(--display);font-size:clamp(34px,5.2vw,52px);line-height:1.08;margin:26px 0 14px;max-width:11ch;letter-spacing:-.04em}
.auth-art p{color:#c5d8d1;font-size:17px;max-width:34ch;line-height:1.45}
.auth-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.auth-badges span{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:12px;color:#dceae4;font-weight:600}
.auth-form{display:grid;place-items:center;padding:36px 28px;background:
  radial-gradient(420px 240px at 100% 0%,rgba(226,177,60,.1),transparent 60%),
  #fbfaf6}
.auth-box{width:100%;max-width:400px;padding:8px}
.auth-box h2{font-family:var(--display);margin:0 0 6px;font-size:28px;letter-spacing:-.03em}
.auth-box .sub{color:var(--muted);margin-bottom:20px;font-size:14px}
.auth-box button.primary{width:100%;margin-top:8px;padding:14px 16px;font-size:16px}
.switch{background:transparent;color:var(--ok);width:100%;margin-top:10px}
.mode-pick{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 20px;background:
  radial-gradient(700px 320px at 80% 0%,rgba(226,177,60,.2),transparent 55%),
  radial-gradient(600px 360px at 10% 100%,rgba(26,60,52,.1),transparent 50%),
  linear-gradient(180deg,#f7f5ef,var(--bg))}
.mode-pick-inner{width:100%;max-width:720px}
.mode-pick-inner h1{font-family:var(--display);font-size:clamp(28px,4vw,40px);margin:0 0 8px;letter-spacing:-.03em;text-align:center}
.mode-pick-inner .sub{text-align:center;color:var(--muted);margin:0 0 28px;font-size:15px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mode-card{text-align:left;padding:22px 20px;border-radius:22px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:210px;transition:transform .15s ease,border-color .15s ease}
.mode-card:hover{transform:translateY(-2px);border-color:#c9b896}
.mode-card.company{background:linear-gradient(160deg,#1a3c34,#2a5649);color:#fff;border:0}
.mode-card.company .mode-card-desc{color:#c5d8d1}
.mode-card.shop{background:linear-gradient(160deg,#fffdf8,#fff6df);border-color:#e8c57a}
.mode-card .mode-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}
.mode-card.company .mode-ico{background:rgba(240,195,90,.2);color:#f0c35a}
.mode-card.shop .mode-ico{background:#1a3c34;color:#f0c35a}
.mode-card b{font-family:var(--display);font-size:20px;letter-spacing:-.02em;line-height:1.25}
.mode-card-desc{font-size:14px;color:var(--muted);line-height:1.4;margin:0;flex:1}
.mode-card .mode-go{font-size:13px;font-weight:800;opacity:.85}
@media(max-width:720px){.mode-cards{grid-template-columns:1fr}}

#toast{position:fixed;bottom:22px;right:22px;background:var(--forest);color:#fff;padding:12px 18px;border-radius:14px;display:none;z-index:40;font-weight:700;box-shadow:0 12px 30px rgba(26,60,52,.3)}
.loading{padding:80px;text-align:center;color:var(--muted)}
.loading::before{content:"";display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid #ddd;border-top-color:var(--forest);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome-flash{position:fixed;inset:0;z-index:100;pointer-events:none;background:rgba(26,60,52,.12);animation:welcomeFlash .7s ease forwards}
@keyframes welcomeFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.low-banner{background:linear-gradient(135deg,#c2473f,#a3332c);color:#fff;border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:0 12px 28px rgba(194,71,63,.28);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;animation:up .35s ease}
.low-banner b{font-family:var(--display);font-size:18px}
.low-banner p{margin:4px 0 0;font-size:13px;opacity:.92}
.low-banner button{background:#fff;color:#a3332c}
.chip.danger{background:#fdeceb;color:var(--danger);animation:pulseSoft 1.8s ease-in-out infinite}
.sync-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px}
.sync-bar.off{background:#fff4df;border-color:#e8c57a}
.sync-bar.queue{background:#e8f1ff;border-color:#9bb7e0}
.sync-bar b{font-weight:800}
.pbtn.low{border-color:#e08a84;background:#fff5f4;box-shadow:0 0 0 2px rgba(194,71,63,.18)}
.pbtn.low .price{color:var(--danger)}
tr.low-row td{background:#fff1f0!important}
tr.low-row:hover td{background:#ffe4e2!important}
.analyze-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:900px){.analyze-grid{grid-template-columns:1fr}}
.rank-card .panel-h{border-bottom:0}
.rank-card.top .panel-h{background:linear-gradient(135deg,#e8f6ef,#fff)}
.rank-card.hot .panel-h{background:linear-gradient(135deg,#fff6df,#fff)}
.rank-card.cold .panel-h{background:linear-gradient(135deg,#f3f1ea,#fff)}
.rank-card.bad .panel-h{background:linear-gradient(135deg,#fdeceb,#fff)}
.rank-list{padding:0 16px 14px;display:grid;gap:8px}
.rank-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#f7f4ec;font-size:13px}
.rank-item .n{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;background:var(--forest);color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
.rank-item.cold .n{background:#8a8070}
.rank-item.bad .n{background:var(--danger)}

@media(max-width:980px){
  :root{
    --bg:#eef1f4;--paper:#ffffff;--line:#e2e8f0;--ink:#0f172a;--muted:#64748b;
    --radius:16px;--shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.06);
  }
  html,body{
    height:auto;
    min-height:100%;
    overflow-x:clip;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:auto;
    touch-action:pan-y pinch-zoom;
    background:var(--bg);
  }
  body{
    background:var(--bg);
  }
  .app{
    display:block;
    min-height:auto;
    padding-bottom:calc(84px + env(safe-area-inset-bottom));
    max-width:100%;
    background:var(--bg);
  }
  aside{
    position:fixed;left:0;right:0;top:auto;bottom:0;z-index:30;
    width:100%;height:auto!important;max-height:calc(72px + env(safe-area-inset-bottom));
    padding:4px 8px calc(4px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);
    box-shadow:0 -6px 24px rgba(15,23,42,.08);
    display:block;
    overflow:hidden;
    pointer-events:none;
  }
  aside .brand,aside .nav-label,aside .aside-foot,aside .shop-switch{display:none}
  aside nav,aside select,aside button{pointer-events:auto}
  nav{
    display:flex;
    flex-wrap:nowrap;
    overflow-x:auto;
    overflow-y:hidden;
    gap:0;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    overscroll-behavior-x:contain;
    touch-action:pan-x;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    white-space:normal;
    padding:6px 4px 4px;
    font-size:10px;
    font-weight:600;
    line-height:1.1;
    flex:0 0 auto;
    width:64px;
    flex-direction:column;
    justify-content:center;
    gap:2px;
    min-height:56px;
    border-radius:14px;
    color:#64748b;
    background:transparent;
  }
  nav button:hover{background:transparent;color:var(--forest)}
  nav button.active{background:rgba(26,60,52,.08);color:var(--forest)}
  nav button span{font-size:18px;line-height:1}
  main{
    display:block;
    padding:12px 12px 28px;min-width:0;max-width:100%;
    background:transparent;
    overflow:visible;
  }
  .top{margin-bottom:12px;gap:8px}
  .top h1{font-size:24px;letter-spacing:-.04em}
  .top p{font-size:12px;color:var(--muted)}
  .chips{gap:6px}
  .chip{padding:6px 10px;font-size:11px;border-radius:999px}
  .quick,.stats,.dash-grid,.analyze-grid{grid-template-columns:1fr;gap:10px}
  .stats{grid-template-columns:1fr 1fr}
  .stat,.dash-card,.panel{
    border-radius:18px;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    background:var(--paper);
  }
  .stat{padding:14px 14px}
  .stat strong{font-size:20px}
  .dash-card strong{font-size:22px}
  .product-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;max-height:none;overflow:visible;
  }
  .cart-lines{max-height:none;overflow:visible}
  .pbtn{
    min-height:0;padding:10px;border-radius:16px;
    gap:6px;border:1px solid var(--line);background:#fff;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .pbtn .ph{aspect-ratio:1.1;border-radius:12px}
  .pbtn b{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pbtn .price{font-size:14px;font-weight:800;color:var(--forest)}
  .cart-box{position:static}
  .cart-total{border-radius:20px}
  .cart-total .sum{font-size:30px}
  .cart-pay{padding:16px;font-size:17px;min-height:52px;border-radius:16px}
  .panel{overflow:visible}
  .panel-h{
    flex-direction:column;align-items:stretch;gap:10px;
    padding:14px 14px;
  }
  .panel-h .acts,.acts,.toolbar,.shift-bar .acts,.dialogbuttons,.img-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;
  }
  .panel-h .acts button,.acts button,.toolbar button,.shift-bar .acts button,
  .dialogbuttons button,.img-actions button,.img-actions label{
    width:100%;min-height:46px;padding:11px 8px;font-size:13px;border-radius:14px;
    white-space:normal;line-height:1.2;
  }
  .toolbar{padding:12px 14px}
  .toolbar input{min-width:0;width:100%;flex:1 1 100%;min-height:44px;border-radius:12px}
  .toolbar .acts, .toolbar > button, .toolbar > label{grid-column:span 1}
  .tablewrap{margin:0 -2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{font-size:12px}
  th,td{padding:12px 10px}
  .formgrid{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr;background:var(--bg)}
  .auth-art{
    min-height:0;padding:18px 18px 14px;
    background:linear-gradient(145deg,#14352e,#1a3c34);
  }
  .auth-art h1{display:none}
  .auth-art p{display:none}
  .auth-badges{display:none}
  .auth-art .brand{font-size:22px;margin:0}
  .auth-art .mark{width:40px;height:40px;font-size:18px;border-radius:12px}
  .auth-form{padding:18px 16px 32px;background:var(--bg);place-items:start center}
  .auth-box{max-width:100%;padding:0}
  .auth-box h2{font-size:24px}
  .auth-box button.primary{min-height:52px;border-radius:16px;font-size:16px}
  dialog{width:min(100vw - 16px,520px);max-height:min(92dvh,900px);overflow:auto;padding:18px;border-radius:22px;margin:auto;border:0;box-shadow:0 24px 60px rgba(15,23,42,.2)}
  dialog h2{font-size:18px}
  .install-banner{flex-direction:column;align-items:stretch;gap:12px;padding:14px;border-radius:20px}
  .install-banner .acts{display:grid;grid-template-columns:1.4fr 1fr;width:100%;gap:8px}
  .install-banner button{min-height:48px;width:100%;border-radius:14px;font-size:14px}
  #toast{left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center;border-radius:16px}
  .mode-cards{grid-template-columns:1fr}
  .mode-card{min-height:160px;border-radius:20px}
  .shift-bar{padding:12px;flex-direction:column;align-items:stretch;border-radius:16px}
  .cats{gap:6px;margin-bottom:10px}
  .cats button{min-height:36px;padding:8px 12px;border-radius:999px}
  .invent-row{grid-template-columns:1fr;gap:6px}
  .side-actions{grid-template-columns:1fr 1fr}
  .big{padding:14px 12px;font-size:14px;min-height:72px;border-radius:16px}
  .cart-line{background:#f8fafc;border-radius:14px}
  button,input,select{touch-action:manipulation}
}
@media(max-width:380px){
  .stats{grid-template-columns:1fr}
  .product-grid{grid-template-columns:1fr 1fr;gap:6px}
  nav button{font-size:9px;min-height:52px;padding:6px 2px}
  .panel-h .acts,.acts,.toolbar,.shift-bar .acts,.dialogbuttons{grid-template-columns:1fr}
}

</style>
</head>
