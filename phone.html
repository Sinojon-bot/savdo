<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savdo → Phone</title>
<style>
body{margin:0;min-height:100vh;font-family:Segoe UI,sans-serif;background:linear-gradient(160deg,#122c27,#1a3c34 50%,#2a5649);color:#fff;display:grid;place-items:center;padding:24px}
.box{width:min(440px,100%);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:28px;text-align:center;backdrop-filter:blur(8px)}
h1{margin:0 0 8px;font-size:28px}
p{color:#c5d8d1;line-height:1.45}
.link{margin:18px 0;padding:14px;border-radius:14px;background:#fff;color:#1a3c34;font-weight:800;font-size:18px;word-break:break-all}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#f0c35a,#e2b13c);color:#2a2208;margin-top:10px}
.steps{text-align:left;margin-top:18px;color:#dceae4;font-size:14px;line-height:1.6}
img{margin-top:14px;border-radius:12px;background:#fff;padding:10px}
.ok{display:none;margin-top:10px;color:#6ee7b7;font-weight:700}
.lang{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.lang button{width:auto;padding:8px 12px;font-size:12px;background:rgba(255,255,255,.12);color:#fff}
.lang button.active{background:#f0c35a;color:#2a2208}
</style>
</head>
<body>
<div class="box">
  <div class="lang" id="lang"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="link" id="url">http://192.168.10.101:4173/</div>
  <button id="copyBtn" onclick="copyLink()"></button>
  <div class="ok" id="ok"></div>
  <img id="qr" width="200" height="200" alt="QR">
  <div class="steps" id="steps"></div>
</div>
<script>
const T={
tg:{title:'Ба телефон фиристед',sub:'Ин суроғаро нусха кунед ва ба Telegram / WhatsApp ба худ фиристед.',copy:'Нусха кардан',ok:'Нусха шуд ✓ — ҳозир ба телефон фиристед',steps:'<b>Дар телефон:</b><br>1. Компютер ва телефон — як Wi‑Fi<br>2. Силкаро кушоед<br>3. Android: Chrome → ⋮ → «Установить приложение»<br>&nbsp;&nbsp;&nbsp;iPhone: Safari → Куниш → «Ба экрани асосӣ»<br>4. Равзанаи START.bat / серверро дар компютер набандед'},
ru:{title:'Отправьте на телефон',sub:'Скопируйте адрес и отправьте себе в Telegram / WhatsApp.',copy:'Скопировать',ok:'Скопировано ✓ — теперь отправьте на телефон',steps:'<b>На телефоне:</b><br>1. Компьютер и телефон — один Wi‑Fi<br>2. Откройте ссылку<br>3. Android: Chrome → ⋮ → «Установить приложение»<br>&nbsp;&nbsp;&nbsp;iPhone: Safari → Поделиться → «На экран „Домой“»<br>4. Не закрывайте START.bat / сервер на компьютере'},
en:{title:'Send to your phone',sub:'Copy the address and send it to yourself in Telegram / WhatsApp.',copy:'Copy',ok:'Copied ✓ — now send it to your phone',steps:'<b>On the phone:</b><br>1. Computer and phone — same Wi‑Fi<br>2. Open the link<br>3. Android: Chrome → ⋮ → “Install app”<br>&nbsp;&nbsp;&nbsp;iPhone: Safari → Share → “Add to Home Screen”<br>4. Keep START.bat / the server open on the computer'}
};
const labels={tg:'Тоҷикӣ',ru:'Русский',en:'English'};
let lang=localStorage.getItem('savdo_lang')||'ru';
function apply(){
  const x=T[lang]||T.ru;
  document.documentElement.lang=lang==='tg'?'tg':lang;
  document.getElementById('title').textContent=x.title;
  document.getElementById('sub').textContent=x.sub;
  document.getElementById('copyBtn').textContent=x.copy;
  document.getElementById('ok').textContent=x.ok;
  document.getElementById('steps').innerHTML=x.steps;
  document.getElementById('lang').innerHTML=['tg','ru','en'].map(l=>`<button class="${l===lang?'active':''}" onclick="setL('${l}')">${labels[l]}</button>`).join('');
}
function setL(l){lang=l;localStorage.setItem('savdo_lang',l);apply()}
const url = location.origin.includes('127.0.0.1')
  ? 'http://192.168.10.101:4173/'
  : location.origin + '/';
document.getElementById('url').textContent = url;
document.getElementById('qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
async function copyLink(){
  try { await navigator.clipboard.writeText(url); }
  catch { prompt('URL', url); }
  document.getElementById('ok').style.display = 'block';
}
apply();
</script>
</body>
</html>
